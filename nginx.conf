server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript image/svg+xml application/json;

    # The page uses inline CSS/JS, so 'unsafe-inline' is required.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location ~* \.html$ {
        expires -1;
    }

    location ~* \.(css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
