server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript image/svg+xml application/json;

    # The page uses inline CSS/JS, so 'unsafe-inline' is required.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location ~* \.html$ {
        expires -1;
    }

    location ~* \.(css|js|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
    }

    # App CRM chạy trong container riêng, phục vụ dưới /crm.
    # Dùng ^~ để không bị các location regex (.js, .css, .html) bắt trước.
    location ^~ /crm {
        # Demo công khai vì dữ liệu là hư cấu. Muốn khóa thì bỏ dấu # ở 2 dòng dưới.
        # auth_basic "CRM Coc Coc demo";
        # auth_basic_user_file /etc/nginx/crm.htpasswd;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $crm_upstream http://crm-site-app:3000;
        proxy_pass $crm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Next.js cần inline script/style; form-action phải cho phép form.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
