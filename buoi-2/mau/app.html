<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo giá của tôi</title>
<style>
:root{--ink:#12261A;--muted:#5F6D63;--line:#D2DAC8;--line-strong:#A4B3A1;--green:#25AF50;--forest:#0B3D22;--paper:#F4F6EC}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55}
header{background:var(--forest);color:#fff;padding:28px 20px;border-bottom:4px solid var(--green)}
.wrap{max-width:960px;margin:0 auto}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
main{max-width:960px;margin:0 auto;padding:24px 20px}
.box{background:#fff;border:1.5px dashed var(--line-strong);padding:40px 28px;text-align:center;color:var(--muted)}
.box b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.box code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--paper);border:1px solid var(--line);padding:1px 5px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Báo giá của tôi</h1>
  </div>
</header>

<main>
  <div class="box">
    <b>Bắt đầu từ đây</b>
    File này là cả app. Việc đầu tiên: nhắn Claude Code đổi tiêu đề thành “Báo giá Cốc Cốc”.
    Sau đó mở <code>bang-gia.csv</code> và bấm nút nạp bảng giá khi app đã có nút đó.
  </div>
</main>
</body>
</html>
